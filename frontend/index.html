<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d4c">
  <title>Goal Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/">Goal Tracker</a>
      <div id="user-area" class="user-area" hidden>
        <span id="who" class="who"></span>
        <label id="preview-wrap" class="preview" hidden>
          <span class="muted">Preview as</span>
          <select id="preview-role">
            <option value="">Developer</option>
            <option value="admin">Admin</option>
            <option value="user">User</option>
          </select>
        </label>
        <button id="logout-btn" class="btn small" type="button">Log out</button>
      </div>
    </header>

    <nav id="nav" class="nav" aria-label="Main"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
